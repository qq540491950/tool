# packages.conf
# 唯一包列表。每行一个包，字段用 ' | ' 分隔：
#
#   name | type | install | update | check
#
# 必填：name、type
# 合法 type：npm（当前仅支持 npm 全局包）
#
# 可选：install / update / check —— 留空则走 npm 内置默认命令。
#        自定义 check 按 shell 命令执行，其输出视为本地版本。
#
# '#' 之后为注释；空行忽略；字段两侧空格自动去除。
#
# 内置默认（type = npm）：
#   install / update : npm install -g <name>
#   check            : 比对 npm view <name> version 与 npm list -g --depth=0

# === 你的实配置：npm 全局包（仅需 name + type） ===
@minimax-ai/code           | npm
@tencent-ai/codebuddy-code | npm
opencode-ai                | npm
@colbymchenry/codegraph    | npm
ccstatusline-zh            | npm

